name: Call update changelog

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target version"
        required: false
        type: string
      name:
        required: true
        type: string
      email:
        required: true
        type: string
      base_branch:
        required: false
        default: master
        type: string
      distribution:
        required: false
        default: unstable
        type: string
      create_pr:
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  update_changelog:
    permissions:
      contents: write
      pull-requests: write
    uses: peeweep-test/.github/.github/workflows/update-changelog.yml@test/peeweep-fixes-20261109
    with:
      version: ${{ inputs.version }}
      name: ${{ inputs.name }}
      email: ${{ inputs.email }}
      base_branch: ${{ inputs.base_branch }}
      distribution: ${{ inputs.distribution }}
      create_pr: ${{ inputs.create_pr }}
    secrets: inherit
